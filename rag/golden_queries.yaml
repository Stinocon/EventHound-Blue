# golden_queries.yaml — query di controllo per valutare la qualità del RAG.
#
# Ogni query è validata dal punto di vista del contenuto e della cybersecurity
# accademica: il campo `reference` cita la fonte canonica (tecnica MITRE ATT&CK,
# pubblicazione NIST, concetto fondamentale). `expect_any`/`expect_all` elencano
# i termini che DEVONO comparire nei chunk recuperati perché la risposta sia
# considerata pertinente.
#
# Esecuzione:  uv run python -m pipeline.evaluate
# Lo script incorpora la query, la cerca lungo il percorso REALE di recupero (ibrido
# denso⊕BM25 + reranking, vedi retrieve.search) nella `collection` indicata e segna PASS
# se i top-k risultati contengono i termini attesi.

version: 1

defaults:
  top_k: 5
  # min_score: solo INFORMATIVO. Con la fusione RRF e il reranker cross-encoder lo score
  # non è più una similarità coseno comparabile a una soglia fissa; il gate di PASS è la
  # presenza dei termini attesi nei chunk recuperati, non un valore numerico.
  min_score: 0.20

queries:

  # ── Conoscenza condivisa: MITRE ATT&CK (collection knowledge_cyber) ──
  - id: attack-lateral-movement-smb
    collection: knowledge_cyber
    query: "movimento laterale tra host Windows tramite SMB e servizi remoti"
    reference: "MITRE ATT&CK — TA0008 Lateral Movement / T1021.002 SMB/Windows Admin Shares"
    expect_any: ["Lateral Movement", "SMB", "Remote Services", "Admin Shares"]

  - id: attack-kerberoasting
    collection: knowledge_cyber
    query: "estrarre e craccare i ticket dei service account Kerberos"
    reference: "MITRE ATT&CK — T1558.003 Kerberoasting"
    expect_any: ["Kerberoasting", "Kerberos", "ticket", "service account"]

  - id: attack-lsass-credential-dumping
    collection: knowledge_cyber
    query: "ottenere credenziali dalla memoria del processo LSASS"
    reference: "MITRE ATT&CK — T1003.001 OS Credential Dumping: LSASS Memory"
    expect_any: ["LSASS", "Credential Dumping", "credential", "memory"]

  - id: attack-phishing-initial-access
    collection: knowledge_cyber
    query: "accesso iniziale tramite email di phishing mirato"
    reference: "MITRE ATT&CK — TA0001 Initial Access / T1566 Phishing"
    expect_any: ["Phishing", "Initial Access", "spearphishing", "Spearphishing"]

  - id: attack-persistence-scheduled-task
    collection: knowledge_cyber
    query: "mantenere la persistenza tramite attività pianificate o cron"
    reference: "MITRE ATT&CK — T1053 Scheduled Task/Job"
    expect_any: ["Scheduled Task", "Persistence", "cron", "Scheduled Job"]

  - id: attack-defense-evasion
    collection: knowledge_cyber
    query: "tecniche per eludere i controlli di sicurezza ed evitare il rilevamento"
    reference: "MITRE ATT&CK — TA0005 Defense Evasion"
    expect_any: ["Defense Evasion", "Masquerading", "Obfuscat", "evasion"]

  # ── Conoscenza condivisa: NIST e concetti fondamentali (knowledge_cyber) ──
  - id: nist-incident-response-lifecycle
    collection: knowledge_cyber
    query: "fasi del processo di gestione degli incidenti di sicurezza"
    reference: "NIST SP 800-61 — Computer Security Incident Handling Guide"
    expect_any: ["Containment", "Eradication", "Recovery", "Detection and Analysis"]

  - id: nist-risk-definition
    collection: knowledge_cyber
    query: "definizione di rischio nella sicurezza delle informazioni"
    reference: "NIST CSRC Glossary — risk (funzione di likelihood e impact)"
    expect_any: ["risk", "likelihood", "impact", "threat"]

  - id: nist-csf-functions
    collection: knowledge_cyber
    query: "le funzioni del NIST Cybersecurity Framework"
    reference: "NIST CSF — Identify, Protect, Detect, Respond, Recover (Govern in 2.0)"
    # expect_any (non _all): pretendere tutti e 5 i termini nello stesso top-k è troppo severo;
    # basta che il contenuto CSF pertinente sia recuperato.
    expect_any: ["Cybersecurity Framework", "Respond", "Recover"]

  - id: concept-cia-triad
    collection: knowledge_cyber
    query: "i tre obiettivi di confidenzialità integrità e disponibilità"
    reference: "Concetto fondamentale — CIA triad"
    expect_any: ["Confidentiality", "Integrity", "Availability"]
