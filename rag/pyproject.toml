[project]
name = "cyber-rag"
# Inert: these are workspace environments, not distributions (`package = false`, no
# build-system), so nothing reads this number. The product version is `analysis/engine/
# version.py` APP_VERSION — one place, deliberately, because six copies of a version is six
# things to forget. It had already drifted eight milestones behind DESIGN once.
version = "0.1.0"
license = "MIT"
description = "Pipeline RAG (crawl4ai + Qdrant) per il workspace Cybersecurity"
requires-python = ">=3.10"
dependencies = [
    "crawl4ai>=0.4.0",
    "qdrant-client>=1.9.0",
    # >=0.7: serve fastembed.rerank.cross_encoder.TextCrossEncoder (reranking) e
    # SparseTextEmbedding (BM25) per il recupero ibrido. Copre denso+sparso+rerank
    # senza dipendenze pesanti in più (niente sentence-transformers).
    "fastembed>=0.7.0",
    "pypdf>=4.0.0",
    "PyYAML>=6.0",
    "python-dotenv>=1.0.0",
    # Server MCP (tool rag_search nativo in sessione). FastMCP è in 'mcp'.
    "mcp>=1.0.0",
]

[project.optional-dependencies]
# Backend di embedding cloud (al posto di fastembed locale):
#   uv sync --extra voyage    |    uv sync --extra openai
voyage = ["voyageai>=0.2.0"]
openai = ["openai>=1.0.0"]
# Servizio HTTP rag-api (rag_api.py): espone il recupero come servizio, modelli caldi.
#   uv sync --extra api && uv run uvicorn rag_api:app --port 8600
api = ["fastapi>=0.110", "uvicorn>=0.29"]

[tool.uv]
# Progetto solo-script: uv gestisce l'ambiente e le dipendenze, non installa un pacchetto.
package = false
