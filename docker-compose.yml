# EventHound — analysis stack in Docker (optional).
#
# `docker compose up` starts the analysis engine + GUI on 127.0.0.1:8700 with every tool baked in.
# On macOS prefer the NATIVE stack (`./setup.sh all`): containers there are CPU-only and RAM-capped
# by the Docker VM. This compose file stays for reproducible / non-macOS deployments.
name: eventhound

services:
  # Analysis engine + GUI. Tools (Hayabusa/tshark/zeek/dotnet+EZ tools) baked into the image.
  eventhound:
    build:
      # Root context, not ./analysis: the engine imports tools/ (settings store, scoring oracle,
      # enrichment gate) through sys.path, and Docker cannot COPY above its context.
      context: .
      dockerfile: analysis/eventhound.Dockerfile
    container_name: eventhound-gui
    ports:
      # Loopback only: the GUI shows real client identifiers, never exposed on the LAN (§9/§10).
      - "127.0.0.1:8700:8700"
    environment:
      - EVENTHOUND_RUNTIME=docker            # tells the frontend to display "Docker"
    volumes:
      # The settings store (API keys, egress consent) lives at <repo root>/data, which is `/data`
      # in here. A NAMED volume, deliberately: without it the keys typed into Settings die with the
      # container, and bind-mounting the host's real `data/` would put client material inside a
      # container as a default, which is a §10 decision and not one to make here.
      - eventhound-config:/data
    restart: unless-stopped

volumes:
  eventhound-config:
