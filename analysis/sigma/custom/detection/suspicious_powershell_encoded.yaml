title: Suspicious Encoded PowerShell Command
id: 11111111-1111-1111-1111-111111111111
status: experimental
description: Detects PowerShell commands with encoded instructions, commonly used by adversaries
references:
    - https://attack.mitre.org/techniques/T1059/001/
author: EventHound
date: 2026/07/20
modified: 2026/07/20
tags:
    - attack.execution
    - attack.t1059.001
logsource:
    category: process_creation
    product: windows
detection:
    selection:
        Image|endswith:
            - '\powershell.exe'
            - '\pwsh.exe'
        CommandLine|contains:
            - ' -enc '
            - ' -EncodedCommand '
            - ' -e '
    condition: selection
falsepositives:
    - Legitimate administrative scripts
level: medium
