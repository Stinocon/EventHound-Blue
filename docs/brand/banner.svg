<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 260" role="img" aria-label="EventHound — local DFIR and cybersecurity analysis">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1017"/>
      <stop offset="1" stop-color="#151a24"/>
    </linearGradient>
    <linearGradient id="head" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b96ff"/>
      <stop offset="1" stop-color="#3f74e0"/>
    </linearGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#eaf1ff"/>
      <stop offset="1" stop-color="#8fb4ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" rx="20" fill="url(#bg)"/>
  <!-- subtle grid/scanline hint -->
  <g opacity="0.05" stroke="#4f8cff" stroke-width="1">
    <line x1="0" y1="65" x2="1200" y2="65"/>
    <line x1="0" y1="130" x2="1200" y2="130"/>
    <line x1="0" y1="195" x2="1200" y2="195"/>
  </g>

  <!-- hound mark (reused from favicon geometry, scaled) -->
  <g transform="translate(70 42) scale(3.6)">
    <path d="M17 15 C9 16 6 26 9 34 C10.5 37.5 14 38 15.5 34.5 C16.5 29 17 21 20 17 Z" fill="#3f74e0"/>
    <path d="M31 15 C39 16 42 26 39 34 C37.5 37.5 34 38 32.5 34.5 C31.5 29 31 21 28 17 Z" fill="#3f74e0"/>
    <path d="M24 11 C31 11 35 16 35 23 C35 31 30.5 37 24 39 C17.5 37 13 31 13 23 C13 16 17 11 24 11 Z" fill="url(#head)"/>
    <ellipse cx="24" cy="31" rx="7" ry="5.5" fill="#6ea1ff"/>
    <circle cx="20" cy="23" r="1.9" fill="#0f1115"/>
    <circle cx="28" cy="23" r="1.9" fill="#0f1115"/>
    <ellipse cx="24" cy="31.5" rx="3.1" ry="2.3" fill="#0f1115"/>
  </g>

  <!-- wordmark -->
  <text x="290" y="132" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="76" font-weight="700" fill="url(#word)" letter-spacing="1">EventHound</text>
  <text x="292" y="176" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="26" font-weight="400" fill="#8b97ad">Local DFIR &amp; cybersecurity analysis</text>

  <!-- tagline chip -->
  <g transform="translate(292 198)">
    <rect x="0" y="0" width="360" height="30" rx="15" fill="#1b2333" stroke="#2b3a55"/>
    <circle cx="18" cy="15" r="4" fill="#4f8cff"/>
    <text x="32" y="20" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="15" fill="#9fb3d6">tools as sensors · one schema · correlation</text>
  </g>
</svg>
